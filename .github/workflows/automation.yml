name: AI Testing
on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  ai-testing:
    name: Build and Run App on Internal Network
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker internal network
        run: docker network create --internal ai-test-subnet

      - name: Start MongoDB container
        run: |
          docker run -d \
            --name mongo \
            --network ai-test-subnet \
            mongo:7

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t backend-under-test-image \
            ./backend

      - name: Start backend container
        run: |
          docker run -d \
            --name backend \
            --network ai-test-subnet \
            -e PORT=3000 \
            -e MONGODB_URI="mongodb://mongo:27017/devshop_codeql_demo" \
            backend-under-test-image

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="http://backend:3000/api" \
            --build-arg BUILD_COMMAND="npm run build" \
            --build-arg RUN_COMMAND="npm run preview -- --host 0.0.0.0 --port 3000" \
            -t app-under-test-image .

      - name: Start frontend container
        run: |
          docker run -d \
            --name app-under-test \
            --network ai-test-subnet \
            app-under-test-image

      - name: Verify backend health inside network
        run: |
          docker run --rm \
            --network ai-test-subnet \
            curlimages/curl:8.9.0 \
            -fsS http://backend:3000/health > /dev/null

      - name: Debug frontend status inside network
        run: |
          docker run --rm \
            --network ai-test-subnet \
            curlimages/curl:8.9.0 \
            sh -c '
              echo "Testing URL: http://app-under-test:3000/index.html";
              curl -sS -D /tmp/headers.txt -o /tmp/body.html http://app-under-test:3000/index.html -w "HTTP_STATUS=%{http_code}\n";
              echo "--- Response headers ---";
              cat /tmp/headers.txt;
              echo "--- Response body preview ---";
              head -n 20 /tmp/body.html;
            '

      - name: Verify frontend is reachable inside network
        run: |
          docker run --rm \
            --network ai-test-subnet \
            curlimages/curl:8.9.0 \
            -fsS http://app-under-test:3000/index.html > /dev/null

      - name: Run custom AI testing action
        uses: xebia-playground/humpty-dumpty-set-on-a-wall@feature-1
        with:
          target-url: http://app-under-test:3000
          sandbox-network: ai-test-subnet
          github-token: ${{ secrets.GH_TOKEN }}
          report-dir: ai-testing-report

      - name: Upload AI testing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-testing-report
          path: ai-testing-report